[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobol-data-parser"
version = "0.5.0"
description = "Parse COBOL DATA DIVISION (JSON/Markdown/decode) and PROCEDURE DIVISION (control-flow/CALL graphs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cobol", "parser", "modernization", "legacy", "json", "mainframe", "control-flow", "call-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cobol-data-parser = "cobol_data_parser.cli:main"
cobol-proc-parser = "cobol_data_parser.cli:proc_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["cobol_data_parser"]
